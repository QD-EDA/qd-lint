name: Pinned slang pilots
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slang-pilots:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3-venv autoconf flex bison gperf libfl-dev zlib1g-dev perl help2man
      - name: Build pinned slang and run real-design probes
        run: bash ci/build_slang_pilots.sh "$RUNNER_TEMP/qd-slang-build"
      - name: Archive evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slang-pilots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qd-slang-build/evidence/
            !${{ runner.temp }}/qd-slang-build/evidence/pinmux/build/**
          if-no-files-found: error
          retention-days: 30
